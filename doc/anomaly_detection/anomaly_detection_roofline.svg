<text x="78" y="616" font-size="10.5" fill="#767671">Gray dashed lines: idealized 1-vector-MAC-instr/cycle ceiling (too optimistic). Blue dashed lines: warm-cache FU ceiling (int8dot_ceiling.c -- correct FU throughput, but data is never actually this cached).</text>
<text x="78" y="632" font-size="10.5" fill="#767671">Amber dashed lines: fc_bottleneck.c warm-cache ceiling (FC_CACHE_MODE=0) -- same op/shape/pass-count as the purple cold-cache line, differing only in cache state. Purple solid line: cold-cache ceiling (FC_CACHE_MODE=1) -- the ceiling that actually applies here, since anomaly_detection_int8's single Invoke() call reads every weight tensor exactly once, never cached.</text>
<text x="78" y="648" font-size="10.5" fill="#767671">Points nudged a few px apart within each arithmetic-intensity cluster for legibility -- every batch-1 FULLY_CONNECTED/LSTM call shares the exact same AI (2.00 FLOP/byte).</text>
